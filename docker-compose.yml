services:
  web:
    build: .
    container_name: ride-security
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
      - db_data:/app/data
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ride-security-tunnel
    command: tunnel --no-autoupdate run
    env_file:
      - .env
    depends_on:
      - web
    restart: unless-stopped

volumes:
  db_data:
