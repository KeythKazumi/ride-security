services:
  web:
    build: .
    container_name: ride-security
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
      - db_data:/app/data
      - deepface_weights:/root/.deepface
    restart: unless-stopped

  motion:
    build: .
    container_name: ride-security-motion
    entrypoint: ["python", "manage.py", "watch_motion"]
    env_file:
      - .env
    volumes:
      - .:/app
      - db_data:/app/data
      - deepface_weights:/root/.deepface
    depends_on:
      - web
    profiles:
      - motion
    restart: unless-stopped

  events:
    build: .
    container_name: ride-security-events
    entrypoint: ["python", "manage.py", "process_events", "--loop"]
    env_file:
      - .env
    volumes:
      - .:/app
      - db_data:/app/data
      - deepface_weights:/root/.deepface
    depends_on:
      - web
    profiles:
      - motion
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ride-security-tunnel
    command: tunnel --no-autoupdate run
    env_file:
      - .env
    depends_on:
      - web
    profiles:
      - tunnel
    restart: unless-stopped

volumes:
  db_data:
  deepface_weights:
