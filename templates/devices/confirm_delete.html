{% extends "base.html" %}

{% block title %}Remove {{ object }} — Ride Security{% endblock %}

{% block content %}
<header class="page-header">
    <h1>Remove {{ object }}</h1>
    <p class="page-subtitle">Are you sure you want to delete this {{ type }}?</p>
</header>

<section class="panel">
    <form method="post" class="form">
        {% csrf_token %}
        <p>This action cannot be undone.</p>
        <div class="form-actions">
            <button type="submit" class="btn btn-danger">Remove {{ type|title }}</button>
            <a href="{% url list_url %}" class="btn btn-ghost">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
